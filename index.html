<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKYLINE PRO</title><style>body{background:#101b30;color:#edf5ff;font:16px system-ui;margin:auto;max-width:960px;padding:20px}section{background:#1b2c45;border-radius:18px;padding:20px;margin:16px 0}button,input,select{font:inherit;padding:10px;background:#233c57;color:white;border:1px solid #54708b;border-radius:9px;margin:4px;max-width:95%}a{color:#7de0f4}header{color:#64d9ee;letter-spacing:.15em}#map{height:300px}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.day{background:#263c56;padding:12px;border-radius:10px}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><header>SKYLINE PRO / WEATHER INTELLIGENCE</header><h1>総合気象ダッシュボード</h1><section><button id="gps">現在地</button><input id="name" placeholder="地点名"><input id="lat" type="number" step="any" placeholder="緯度"><input id="lon" type="number" step="any" placeholder="経度"><button id="save">地点登録</button><select id="saved"></select><button id="del">削除</button><div id="map"></div><p id="status"></p></section><section><h2>気象庁 地域予報</h2><select id="area"></select><button id="refresh">更新</button><div id="forecast" class="days"></div><p id="issued"></p><a href="https://www.jma.go.jp/bosai/forecast/">出典：気象庁</a></section><section><h2>ピンポイント・16日間予報</h2><p>気象API未接続。現在は地域予報のみ利用できます。</p></section><section><h2>自動通知</h2><p>サーバー設定前のため停止中。</p></section><section><h2>雨雲・防災・海上気象</h2><p><a href="https://www.jma.go.jp/bosai/nowc/">雨雲・雷</a>　<a href="https://www.jma.go.jp/bosai/warning/">警報</a>　<a href="https://www.jma.go.jp/bosai/typhoon/">台風</a>　<a href="https://www.jma.go.jp/bosai/wave/">波浪</a>　<a href="https://www.data.jma.go.jp/kaiyou/db/tide/suisan/">潮汐</a></p></section><small>試験版。地点は端末内保存。安全判断には公式情報を確認してください。</small><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=x=>document.getElementById(x);let p=[];try{p=JSON.parse(localStorage.getItem('skyline-places')||'[]')}catch{};let map,marker;if(window.L){map=L.map('map').setView([34.39,132.46],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);map.on('click',e=>pos(e.latlng.lat,e.latlng.lng))}function pos(a,b){$('lat').value=a;$('lon').value=b;if(map){if(marker)marker.remove();marker=L.marker([a,b]).addTo(map);map.setView([a,b],10)}}function list(){$('saved').replaceChildren(new Option('登録地点',''),...p.map((v,i)=>new Option(v.name,i)));localStorage.setItem('skyline-places',JSON.stringify(p))}list();$('gps').onclick=()=>navigator.geolocation.getCurrentPosition(v=>{pos(v.coords.latitude,v.coords.longitude);$('status').textContent='位置取得完了。予報地域を選択してください。'},e=>$('status').textContent=e.message);$('save').onclick=()=>{let a=Number($('lat').value),b=Number($('lon').value);if(!$('lat').value||!$('lon').value||Math.abs(a)>90||Math.abs(b)>180)return;p.push({name:$('name').value||a+','+b,a,b,area:$('area').value});list()};$('saved').onchange=()=>{let v=p[$('saved').value];if(v){pos(v.a,v.b);$('name').value=v.name;$('area').value=v.area;load()}};$('del').onclick=()=>{if($('saved').value!==''){p.splice(Number($('saved').value),1);list()}};async function load(){try{let r=await fetch('https://www.jma.go.jp/bosai/forecast/data/forecast/'+$('area').value+'.json');if(!r.ok)throw Error(r.status);let d=await r.json();$('forecast').replaceChildren();for(let s of d[0].timeSeries)for(let a of s.areas)if(a.weathers)a.weathers.forEach((w,i)=>{let e=document.createElement('div');e.className='day';e.textContent=a.area.name+' '+s.timeDefines[i].slice(0,10)+' '+w;$('forecast').append(e)});$('issued').textContent='発表 '+d[0].reportDatetime}catch(e){$('issued').textContent='取得失敗 '+e.message}}$('refresh').onclick=load;(async()=>{try{let r=await fetch('https://www.jma.go.jp/bosai/common/const/area.json');let d=await r.json();for(let [k,v] of Object.entries(d.offices))$('area').add(new Option(v.name,k));$('area').value='340000';load()}catch(e){$('issued').textContent='地域一覧取得失敗 '+e.message}})();</script></html>
